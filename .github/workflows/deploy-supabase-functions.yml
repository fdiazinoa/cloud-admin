name: Deploy Supabase schema and Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - supabase/config.toml
      - supabase/functions/**
      - supabase/migrations/**
      - .github/workflows/deploy-supabase-functions.yml
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy database and HelpDesk functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF"
          test -n "$SUPABASE_DB_PASSWORD"

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Preview pending migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --dry-run

      - name: Apply pending migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Validate Resend webhook secret
        run: |
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json \
            | jq -e 'any(.[]; .name == "RESEND_WEBHOOK_SECRET")'

      - name: Deploy inbound email processor
        run: supabase functions deploy process-inbound-email --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy integration settings saver
        run: supabase functions deploy save-integration-settings --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy support reply sender
        run: supabase functions deploy send-support-reply --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy support draft generator
        run: supabase functions deploy generate-support-draft --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy support message reader
        run: supabase functions deploy get-support-messages --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy support resolver
        run: supabase functions deploy resolve-support-ticket --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy support feedback receiver
        run: supabase functions deploy submit-support-feedback --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy secure helpdesk API
        run: supabase functions deploy helpdesk-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy internal requests API
        run: supabase functions deploy internal-requests-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy internal knowledge API
        run: supabase functions deploy knowledge-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Resend delivery webhook
        run: supabase functions deploy process-resend-delivery --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
